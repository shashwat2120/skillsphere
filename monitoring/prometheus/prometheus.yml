# Scrape config for SkillSphere's 12 processes. Static targets rather than
# Eureka-based service discovery: every port here is fixed by that service's
# own application.yml (see each service's `server.port`), and Prometheus
# itself runs in Docker while every JVM process runs on the host, so the
# simplest correct thing is to point at host.docker.internal (Docker
# Desktop's DNS name for the host machine) rather than build an
# eureka_sd_configs integration for a fixed, already-known set of 12 targets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: skillsphere
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: skillsphere-backend
      - targets: ["host.docker.internal:8081"]
        labels:
          service: identity-service
      - targets: ["host.docker.internal:8082"]
        labels:
          service: notification-service
      - targets: ["host.docker.internal:8083"]
        labels:
          service: analytics-service
      - targets: ["host.docker.internal:8084"]
        labels:
          service: content-service
      - targets: ["host.docker.internal:8085"]
        labels:
          service: assessment-service
      - targets: ["host.docker.internal:8086"]
        labels:
          service: career-service
      - targets: ["host.docker.internal:8087"]
        labels:
          service: verification-service
      - targets: ["host.docker.internal:8088"]
        labels:
          service: realtime-service
      - targets: ["host.docker.internal:9000"]
        labels:
          service: gateway
      - targets: ["host.docker.internal:8761"]
        labels:
          service: discovery-server
      - targets: ["host.docker.internal:8888"]
        labels:
          service: config-server
