server:
  port: 8087

spring:
  application:
    name: verification-service

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:postgresql://localhost:5432/skillsphere
    username: skillsphere
    password: skillsphere
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

skillsphere:
  viva:
    default-turns: 5
    pass-threshold: 0.60
    turn-time-limit-seconds: 180
  ollama:
    base-url: http://localhost:11434
    model: llama3.2:3b
    # Cold load on Windows measured ~12s for this model; subsequent calls are
    # sub-second once it's resident. Set generously above the cold case so a
    # first-of-session viva doesn't time out while the model loads.
    timeout-seconds: 45
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-me-at-least-32-bytes-long}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      issuer: skillsphere
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.skillsphere: DEBUG
