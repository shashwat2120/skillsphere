server:
  port: 8085

spring:
  application:
    name: assessment-service

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:postgresql://localhost:5432/skillsphere
    username: skillsphere
    password: skillsphere
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

skillsphere:
  # Every one of these has an inline default in the code (@Value("${...:X}")),
  # but diagnostic-target-se's default there is 0.30 — the monolith
  # deliberately overrode it to 0.40 (see the comment this was copied from:
  # research-grade precision needs ~34 items per skill, which no teaching
  # bank sustains; 0.40 needs ~18, which is realistic and ample for routing).
  # Copied here so this service's actual behaviour matches, not just its
  # compiled-in fallback.
  adaptive:
    elo-k-factor: 32
    diagnostic-max-items: 25
    diagnostic-target-se: 0.40
    mastery-threshold: 0.80
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-me-at-least-32-bytes-long}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      issuer: skillsphere
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.skillsphere: DEBUG
