server:
  port: 8082

spring:
  application:
    name: notification-service

  config:
    import: "optional:configserver:http://localhost:8888"

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.skillsphere.notification.internal
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.skillsphere.notification.internal.IdentityEventEnvelope

skillsphere:
  mail:
    from-address: ${MAIL_FROM:noreply@skillsphere.dev}
    from-name: SkillSphere
    app-base-url: ${APP_BASE_URL:http://localhost:5173}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.skillsphere: DEBUG
