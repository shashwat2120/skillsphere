spring:
  application:
    # Doubles as the Eureka service id and the name the config server
    # matches config files against (skillsphere-backend.yml) — the two
    # conventions Sprint 6 relies on both key off this one value.
    name: skillsphere-backend

  # "optional:" is the whole design here: this monolith must keep booting
  # and behaving exactly as it did in Sprint 5 whether or not the Sprint 6
  # config server happens to be running. Centralised config is additive,
  # never a new hard dependency for what is still a perfectly good
  # standalone application.
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:postgresql://localhost:5432/skillsphere
    username: skillsphere
    password: skillsphere
    hikari:
      # Sized for a single app instance against one Postgres. Bigger is not
      # better: every idle connection is memory on the database side, and the
      # bottleneck is almost never the pool.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    # Flyway owns the schema. Hibernate must never alter it — 'validate' turns a
    # drifted entity into a startup failure instead of a silent data problem.
    hibernate:
      ddl-auto: validate
    open-in-view: false          # avoids lazy loading during view rendering
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    # Two locations: schema ships everywhere, demo content does not.
    # A production profile lists only db/migration, so a fictional Java course
    # can never appear on a real deployment and nobody has to remember a
    # 'delete the demo data' step.
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: false
    validate-on-migrate: true
    # V899 (the skill graph) was written and added after V908 had already
    # run on every developer database this project has — the skills it
    # seeds existed only as hand-created rows until this session, so V899's
    # version number reflects where it logically belongs (before every seed
    # file that references a skill by slug), not when it was written. A
    # fresh clone never hits this — Flyway applies every migration in
    # version order from empty — but any database that already migrated
    # past V899's version needs Flyway told explicitly that a lower-
    # numbered migration arriving late is expected, not a corruption.
    out-of-order: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  threads:
    virtual:
      # Java 21 virtual threads. The decisive win for us is WebSocket and
      # inference work, where requests spend their life blocked on I/O.
      enabled: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024
  error:
    # Never leak stack traces or internal messages to a client.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        # Readiness decides whether this instance should receive traffic, so it
        # includes only what the app genuinely cannot serve requests without.
        # Mail is deliberately excluded: it is queued and asynchronous, so an
        # SMTP outage must not pull a healthy instance out of the load balancer
        # and turn a degraded feature into an outage. It still appears in the
        # overall health report, where it belongs.
        readiness:
          include: db, redis
        liveness:
          include: livenessState
  health:
    redis:
      enabled: true

# ---------------------------------------------------------------------------
# Application settings. Values that tune learning behaviour also exist in the
# platform_settings table so an admin can retune them without a redeploy; these
# are the bootstrap defaults.
# ---------------------------------------------------------------------------
skillsphere:
  security:
    jwt:
      # Override in every non-local environment. Never commit a real secret.
      secret: ${JWT_SECRET:local-development-secret-change-me-at-least-32-bytes-long}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      issuer: skillsphere
    cors:
      # Listed explicitly, never wildcarded. A wildcard cannot be combined with
      # credentials, and an enumerated list means a bad deployment fails loudly
      # instead of quietly accepting requests from any origin.
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Sprint 6: registers this instance with Eureka so the gateway (and, later,
# any extracted service) can find it by name instead of a fixed host:port.
# Registration retries in the background rather than blocking startup, so
# this monolith still boots and runs standalone with discovery-server never
# started at all — see the spring.config.import comment above for the same
# principle applied to the config server.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.skillsphere: DEBUG
    org.flywaydb: INFO
