<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Instructor access approved</title></head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="max-width:560px;background-color:#ffffff;border-radius:12px;border:1px solid #e4e6eb;">
      <tr><td style="padding:32px 40px 8px 40px;">
        <span style="font-size:20px;font-weight:600;color:#1a1a2e;letter-spacing:-0.3px;">SkillSphere</span>
      </td></tr>
      <tr><td style="padding:8px 40px 24px 40px;">
        <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;font-weight:600;color:#1a1a2e;">
          You're approved to teach
        </h1>
        <p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;color:#4a4a5e;">
          Hi <span th:text="${fullName}">there</span>,
        </p>
        <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#4a4a5e;">
          An administrator has approved your instructor access. You can sign in now and
          start authoring content, writing assessment items and reviewing submissions.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="background-color:#4f46e5;border-radius:8px;">
            <a th:href="${appBaseUrl} + '/login'" href="#"
               style="display:inline-block;padding:13px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">
              Sign in
            </a>
          </td>
        </tr></table>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
