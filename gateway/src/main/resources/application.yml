server:
  # Not 8000: something outside this project's own processes (an unrelated
  # sandbox-owned service, unrelated to anything Sprint 5/6 starts) already
  # holds that port on this machine, and killing a process this session
  # never launched itself is not a safe move — 9000 sidesteps the conflict
  # entirely and is otherwise unused here.
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    loadbalancer:
      # Client-side load balancing needs the caller to already know which
      # instances exist; with exactly one skillsphere-backend instance this
      # is a formality now and the reason a second instance needs zero
      # gateway changes later.
      eureka:
        approximate-zone-from-hostname: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Backs GatewayRoutes' circuitBreaker() filter on every route — see that
# class's own comment for why every route needs one. One instance per
# service rather than one shared breaker: a struggling verification-
# service (the one calling out to Ollama, genuinely the slowest thing in
# this system) should not trip identity-service's breaker and lock out
# login for everyone else.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        # Half the last 10 requests failing is treated as "this service is
        # actually struggling", not one-off noise from a single slow query.
        failure-rate-threshold: 50
        # A request itself already times out well before this (each
        # service's own Tomcat/JDBC timeouts), so this is a second,
        # explicit line: if a call takes longer than 4s, the breaker
        # counts it as a failure even if it eventually succeeds, since a
        # caller waiting 4s+ for the gateway is already a bad experience.
        slow-call-duration-threshold: 4s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
    instances:
      identity-service-cb:
        base-config: default
      analytics-service-cb:
        base-config: default
      content-service-cb:
        base-config: default
      assessment-service-cb:
        base-config: default
      career-service-cb:
        base-config: default
      verification-service-cb:
        base-config: default
      realtime-service-cb:
        base-config: default
      skillsphere-backend-cb:
        base-config: default
  # Spring Cloud Gateway MVC's circuitBreaker() route filter also picks up a
  # TimeLimiter from this same resilience4j-spring-boot3 autoconfiguration,
  # by the same instance name as the breaker — and without this block, that
  # meant every route silently ran under resilience4j's built-in DEFAULT
  # TimeLimiterConfig, whose timeout-duration is exactly one second. That
  # went unnoticed while every route only ever proxied fast calls; it broke
  # for real the moment a call that is slow but legitimate went through the
  # gateway — Argon2id-hashing ten MFA recovery codes takes several seconds
  # under load, and verification-service's own OllamaClient is allowed up to
  # 45s (ollama.timeout-seconds) for AI viva grading. Both were getting cut
  # off by the gateway a full 6-40+ seconds before the service they were
  # calling actually finished, DESPITE that service's own timeout being
  # configured correctly — the caller had already given up and moved on to
  # the fallback. This block gives each route enough room to let its own
  # downstream timeout be the one that actually fires.
  timelimiter:
    configs:
      default:
        timeout-duration: 8s
    instances:
      identity-service-cb:
        base-config: default
        # MFA enrollment hashes ten recovery codes with Argon2id — deliberately
        # memory-hard/slow, and 12s proved not enough headroom under a heavily
        # loaded dev machine (observed up to ~14s). 30s costs nothing on the
        # fast, common calls this same breaker also guards (login, register)
        # since they return in milliseconds either way.
        timeout-duration: 30s
      verification-service-cb:
        base-config: default
        # Longer than ollama.timeout-seconds (45s) itself, so verification-
        # service's own OllamaUnavailableException is what a caller sees on
        # a genuine Ollama timeout, not this gateway giving up first.
        timeout-duration: 50s
      analytics-service-cb:
        base-config: default
      content-service-cb:
        base-config: default
      assessment-service-cb:
        base-config: default
      career-service-cb:
        base-config: default
      realtime-service-cb:
        base-config: default
      skillsphere-backend-cb:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,circuitbreakerevents,prometheus
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
