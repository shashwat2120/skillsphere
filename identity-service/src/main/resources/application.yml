server:
  port: 8081

spring:
  application:
    name: identity-service

  config:
    import: "optional:configserver:http://localhost:8888"

  # identity_db — this service's own database, on the same local Postgres
  # instance as every other service (zero new infrastructure; the pattern
  # that matters is data ownership, not a separate physical server). Every
  # other service's foreign keys pointing at users(id) were dropped from
  # the shared skillsphere database in the same migration that created
  # this one (backend's V18) — see that file's comment for why a plain
  # unenforced user_id column is the right trade here, not a synchronous
  # existence check on every write.
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: skillsphere
    password: skillsphere
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true

  jpa:
    # validate, never update: Flyway (this service's own now, see pom.xml)
    # owns the schema; Hibernate only checks its entity mappings against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    # Consumes admin-audit-events: assessment-service's skill-catalog admin
    # actions arrive here instead of writing admin_audit_log directly, now
    # that database-per-service means it can't reach this table any more —
    # see AdminActionRecordedEvent's class comment.
    consumer:
      group-id: identity-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.skillsphere.identity.internal
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.skillsphere.identity.internal.AdminActionRecordedEvent

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.skillsphere: DEBUG

# This app's own settings, the same root key the monolith uses — JwtProperties
# etc. bind to "skillsphere.security.jwt", not "spring.security.jwt", and
# that prefix has to match exactly regardless of which process is running
# the same @ConfigurationProperties class.
skillsphere:
  security:
    jwt:
      # Must match the monolith's value exactly — a token this service
      # issues has to verify everywhere else it is presented. Same env var,
      # same default, for the same reason.
      secret: ${JWT_SECRET:local-development-secret-change-me-at-least-32-bytes-long}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      issuer: skillsphere
    rate-limit:
      login-attempts-per-minute: 5
      login-attempts-per-hour: 20
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    # Passkeys (SKILLSPHERE.md §6). rp-id must be the frontend's own domain —
    # "localhost" for the Vite dev server on http://localhost:5173 — and
    # origin must match exactly what the browser reports, scheme and port
    # included, or every ceremony fails verification by design of the spec.
    webauthn:
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: SkillSphere
      origin: ${WEBAUTHN_ORIGIN:http://localhost:5173}
