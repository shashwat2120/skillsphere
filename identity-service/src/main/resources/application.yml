server:
  port: 8081

spring:
  application:
    name: identity-service

  config:
    import: "optional:configserver:http://localhost:8888"

  # Same physical database the monolith uses — an interim step, not the end
  # state. True database-per-service (identity gets its own Postgres
  # instance, the monolith drops every foreign key pointing at users(id))
  # is the next increment once this app-level split is proven; doing both
  # at once would mean verifying two large, unrelated risks together.
  datasource:
    url: jdbc:postgresql://localhost:5432/skillsphere
    username: skillsphere
    password: skillsphere
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    # validate, never update: this service does not own the schema in this
    # interim arrangement, the monolith's Flyway does. Flyway itself is
    # absent from this app entirely (see pom.xml) for the same reason.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.skillsphere: DEBUG

# This app's own settings, the same root key the monolith uses — JwtProperties
# etc. bind to "skillsphere.security.jwt", not "spring.security.jwt", and
# that prefix has to match exactly regardless of which process is running
# the same @ConfigurationProperties class.
skillsphere:
  security:
    jwt:
      # Must match the monolith's value exactly — a token this service
      # issues has to verify everywhere else it is presented. Same env var,
      # same default, for the same reason.
      secret: ${JWT_SECRET:local-development-secret-change-me-at-least-32-bytes-long}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      issuer: skillsphere
    rate-limit:
      login-attempts-per-minute: 5
      login-attempts-per-hour: 20
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
