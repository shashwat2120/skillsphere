services:
  postgres:
    image: postgres:16-alpine
    container_name: skillsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillsphere
      POSTGRES_USER: skillsphere
      POSTGRES_PASSWORD: skillsphere
      # Deterministic collation so ORDER BY behaves identically everywhere,
      # including inside Testcontainers and on a teammate's machine.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The app must not start migrating before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U skillsphere -d skillsphere"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: skillsphere-redis
    restart: unless-stopped
    # appendonly keeps the JWT denylist across restarts — losing it would
    # silently resurrect revoked tokens until they expire.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka-API-compatible broker for Sprint 6's cross-service events — the
  # substitute for the in-process ApplicationEventPublisher calls that
  # worked when identity and notification were one JVM and stop working
  # the moment they are not. Redpanda over real Kafka for the same reason
  # as everywhere else in this project: one container, no ZooKeeper, free,
  # and the wire protocol is Kafka's, so spring-kafka needs no code aware
  # it isn't talking to Kafka itself.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: skillsphere-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    container_name: skillsphere-mailpit
    restart: unless-stopped
    # Catches every outgoing email instead of delivering it, with a web inbox
    # at :8025. This is how mail should be handled in development — the
    # alternative is either sending real email to real people by accident, or
    # disabling mail entirely and never noticing that a template is broken.
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
